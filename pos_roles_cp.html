<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Форма обратной связи</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 24px 16px;
    color: #1f2937;
    min-height: 100vh;
  }
  .container {
    max-width: 680px;
    margin: 0 auto;
    background: #fff;
    padding: 32px 28px;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,.07);
  }
  h1 { font-size: 22px; margin: 0 0 24px; text-align: center; font-weight: 700; }

  .progress { display: flex; justify-content: space-between; position: relative; margin-bottom: 32px; padding: 0 8px; }
  .progress::before { content: ""; position: absolute; top: 16px; left: 24px; right: 24px; height: 2px; background: #e0e4ea; z-index: 0; }
  .step-dot {
    position: relative; z-index: 1; width: 32px; height: 32px; border-radius: 50%;
    background: #e0e4ea; color: #6b7280; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; transition: .3s;
  }
  .step-dot.active { background: #3b82f6; color: #fff; box-shadow: 0 0 0 4px rgba(59,130,246,.18); }
  .step-dot.done   { background: #22c55e; color: #fff; }

  .step { display: none; }
  .step.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .field-label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #374151; }
  .field-hint  { display: block; font-size: 12px; color: #9ca3af; margin-bottom: 8px; }
  .input {
    width: 100%; padding: 12px 14px; font-size: 15px;
    border: 2px solid #e0e4ea; border-radius: 10px; background: #fff;
    color: #1f2937; transition: .2s; font-family: inherit;
  }
  .input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
  .input:disabled { background: #f9fafb; color: #9ca3af; cursor: not-allowed; }
  textarea.input { resize: vertical; min-height: 130px; }
  .counter { margin-top: 8px; font-size: 13px; color: #6b7280; text-align: right; }

  .question { font-size: 22px; font-weight: 700; text-align: center; margin: 8px 0 20px; }
  .radio-group { display: flex; gap: 12px; }
  .radio-card { flex: 1; position: relative; }
  .radio-card input { position: absolute; opacity: 0; pointer-events: none; }
  .radio-card span {
    display: block; padding: 16px; text-align: center;
    border: 2px solid #e0e4ea; border-radius: 10px; cursor: pointer;
    font-weight: 600; transition: .2s; user-select: none;
  }
  .radio-card span:hover { border-color: #93c5fd; }
  .radio-card input:checked + span { border-color: #3b82f6; background: #eff6ff; color: #2563eb; }

  .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; }
  .btn {
    padding: 12px 24px; font-size: 15px; font-weight: 600;
    border-radius: 10px; border: none; cursor: pointer; transition: .2s; font-family: inherit;
  }
  .btn-primary { background: #3b82f6; color: #fff; margin-left: auto; }
  .btn-primary:hover { background: #2563eb; }
  .btn-secondary { background: #fff; color: #374151; border: 2px solid #e0e4ea; }
  .btn-secondary:hover { background: #f9fafb; border-color: #d1d5db; }
  .btn-success { background: #22c55e; color: #fff; }
  .btn-success:hover { background: #16a34a; }

  .farewell { text-align: center; padding: 16px 0 8px; }
  .farewell-icon {
    width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 50%;
    background: #dcfce7; color: #22c55e; display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 700;
  }
  .farewell h2 { margin: 0 0 8px; font-size: 22px; }
  .farewell p { margin: 0 0 8px; color: #6b7280; }

  .admin-panel {
    display: none; margin-top: 24px; padding: 16px;
    border: 2px dashed #f59e0b; border-radius: 10px;
    background: #fffbeb; text-align: center;
  }
  .admin-panel.visible { display: block; }
  .admin-panel p { font-size: 13px; color: #92400e; margin: 0 0 12px; }

  @media (max-width: 480px) {
    .container { padding: 24px 18px; }
    .radio-group { flex-direction: column; }
    .progress::before { left: 20px; right: 20px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Форма обратной связи</h1>

  <div class="progress">
    <div class="step-dot" data-step="1">1</div>
    <div class="step-dot" data-step="2">2</div>
    <div class="step-dot" data-step="3">3</div>
    <div class="step-dot" data-step="4">4</div>
    <div class="step-dot" data-step="5">5</div>
  </div>

  <div class="wizard">
    <!-- Шаг 1 -->
    <section class="step active" data-step="1">
      <label class="field-label" for="region">Выберите регион</label>
      <select id="region" class="input">
        <option value="">— выберите регион —</option>
      </select>
    </section>

    <!-- Шаг 2 -->
    <section class="step" data-step="2">
      <label class="field-label" for="sub">Выберите вашу ОО</label>
      <span class="field-hint">Образовательная организация, в которой вы работаете</span>
      <select id="sub" class="input" disabled>
        <option value="">— сначала выберите регион —</option>
      </select>
    </section>

    <!-- Шаг 3 -->
    <section class="step" data-step="3">
      <p class="question">У вас получилось?</p>
      <div class="radio-group">
        <label class="radio-card">
          <input type="radio" name="gotIt" value="Да">
          <span>Да</span>
        </label>
        <label class="radio-card">
          <input type="radio" name="gotIt" value="Нет">
          <span>Нет</span>
        </label>
      </div>
    </section>

    <!-- Шаг 4 -->
    <section class="step" data-step="4">
      <label class="field-label" for="comment">Опишите, что не получилось</label>
      <textarea id="comment" class="input" maxlength="1000" rows="6"
        placeholder="Напишите, что пошло не так..."></textarea>
      <div class="counter" id="counter">Осталось символов: 1000 / 1000</div>
    </section>

    <!-- Шаг 5 -->
    <section class="step" data-step="5">
      <div class="farewell">
        <div class="farewell-icon">✓</div>
        <h2>Спасибо!</h2>
        <p>Ваш ответ сохранён.</p>
      </div>

      <div class="admin-panel" id="adminPanel">
      <p>Режим администратора.</p>
      <a href="https://docs.google.com/spreadsheets/d/1AF2b5Usn33eYgsjcc4Cv6_fgdWwVkZgfxtglEx_0Wms/edit?usp=sharing" target="_blank" class="btn btn-success" style="display:inline-block;text-decoration:none;">
      Открыть таблицу с ответами
      </a>
      </div>
    </section>
  </div>

  <div class="nav" id="nav">
    <button type="button" id="btnBack" class="btn btn-secondary">Назад</button>
    <button type="button" id="btnNext" class="btn btn-primary">Далее</button>
  </div>
</div>

const STORAGE_KEY    = 'feedback_submissions';
const ADMIN_PASSWORD = 'admin123';

const state = { step: 1, isAdmin: false };

const $  = (id) => document.getElementById(id);
const $$ = (sel) => document.querySelectorAll(sel);

/* ==========================
   Заполнение списка регионов
   ========================== */
function fillRegions() {
  const sel = $('region');
  Object.keys(REGIONS).forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    sel.appendChild(opt);
  });
}

/* ==========================
   Навигация
   ========================== */
function showStep(n) {
  state.step = n;
  $$('.step').forEach(el => el.classList.toggle('active', Number(el.dataset.step) === n));
  updateProgress(n);

  if (n === 5) {
    $('nav').style.display = 'none';
    $('adminPanel').classList.toggle('visible', state.isAdmin);
  } else {
    $('nav').style.display = 'flex';
    $('btnBack').style.visibility = n === 1 ? 'hidden' : 'visible';
    $('btnNext').textContent = n === 4 ? 'Отправить' : 'Далее';
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateProgress(current) {
  $$('.step-dot').forEach(dot => {
    const s = Number(dot.dataset.step);
    dot.classList.toggle('active', s === current);
    dot.classList.toggle('done', s < current);
  });
}

/* ==========================
   Валидация
   ========================== */
function validateStep(n) {
  if (n === 1 && !$('region').value) {
    alert('Пожалуйста, выберите регион.'); return false;
  }
  if (n === 2 && !$('sub').value) {
    alert('Пожалуйста, выберите вашу образовательную организацию.'); return false;
  }
  if (n === 3 && !document.querySelector('input[name="gotIt"]:checked')) {
    alert('Пожалуйста, ответьте на вопрос «У вас получилось?».'); return false;
  }
  if (n === 4 && !$('comment').value.trim()) {
    alert('Пожалуйста, опишите, что не получилось.'); return false;
  }
  return true;
}

/* ==========================
   Далее / Назад
   ========================== */
function next() {
  const n = state.step;
  if (!validateStep(n)) return;

  if (n === 1) { showStep(2); return; }
  if (n === 2) { showStep(3); return; }

  if (n === 3) {
    const gotIt = document.querySelector('input[name="gotIt"]:checked').value;
    if (gotIt === 'Да') {
      saveSubmission();          // ← showStep(5) больше не нужен
    } else {
      showStep(4);
    }
    return;
  }

  if (n === 4) {
    saveSubmission();            // ← тоже убрали showStep(5)
  }
}

function back() {
  if (state.step > 1) showStep(state.step - 1);
}

/* ==========================
   Регион → ОО
   ========================== */
function onRegionChange() {
  const region = $('region').value;
  const sub = $('sub');
  sub.innerHTML = '';

  if (!region) {
    sub.disabled = true;
    sub.innerHTML = '<option value="">— сначала выберите регион —</option>';
    return;
  }

  sub.disabled = false;
  const placeholder = document.createElement('option');
  placeholder.value = '';
  placeholder.textContent = '— выберите образовательную организацию —';
  sub.appendChild(placeholder);

  (REGIONS[region] || []).forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    sub.appendChild(opt);
  });
}

/* ==========================
   Счётчик
   ========================== */
function onCommentInput() {
  const len = $('comment').value.length;
  $('counter').textContent = `Осталось символов: ${1000 - len} / 1000`;
}

/* ==========================
   Сохранение
   ========================== */
function loadSubmissions() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch (e) { return []; }
}

async function saveSubmission() {
  const scriptURL = 'https://script.google.com/macros/s/AKfycbwtlBqG0qnSDbGp9r6sTkB3Rx579kpGXkgqVu_9xt6god2m7pmDD_UMQKDETQR4gK9w/exec';

  const gotIt = document.querySelector('input[name="gotIt"]:checked').value;
  const comment = gotIt === 'Нет' ? $('comment').value.trim() : '';

  const payload = {
    'Регион': $('region').value,
    'Образовательная организация': $('sub').value,
    'Получилось': gotIt,
    'Комментарий': comment
  };

  // Блокируем кнопку на время отправки — защита от двойных кликов.
  const btn = $('btnNext');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Отправка...';

  try {
    const response = await fetch(scriptURL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
      },
      body: new URLSearchParams(payload)
    });

    const result = await response.json();

    if (result.result === 'success') {
      showStep(5);
    } else {
      throw new Error(result.message || 'Неизвестная ошибка сервера');
    }
  } catch (error) {
    console.error('Ошибка отправки:', error);
    alert('Не удалось сохранить ответ. Проверьте интернет-соединение и попробуйте ещё раз.');
  } finally {
    // Возвращаем кнопку в исходное состояние в любом случае.
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

/* ==========================
   Скрытый вход администратора
   ==========================
   • Ctrl+Shift+A — запрос пароля в любой момент
   • ?admin=1 в URL — то же при загрузке страницы
*/
function requestAdminAccess() {
  if (state.isAdmin) { alert('Вы уже в режиме администратора.'); return; }
  const pwd = prompt('Введите пароль администратора:');
  if (pwd === null) return;
  if (pwd === ADMIN_PASSWORD) {
    state.isAdmin = true;
    if (state.step === 5) $('adminPanel').classList.add('visible');
    alert('Доступ администратора получен.');
  } else {
    alert('Неверный пароль.');
  }
}

/* ==========================
   Экспорт в Excel
   ========================== */
function exportToExcel() {
  if (!state.isAdmin) { alert('Доступ запрещён.'); return; }

  const all = loadSubmissions();
  if (all.length === 0) { alert('Пока нет сохранённых ответов для экспорта.'); return; }
  if (typeof XLSX === 'undefined') {
    alert('Не удалось загрузить библиотеку для экспорта. Проверьте интернет-соединение.');
    return;
  }

  const rows = all.map(r => ({
    'Дата и время': new Date(r.date).toLocaleString('ru-RU'),
    'Регион': r.region,
    'Образовательная организация': r.sub,
    'Получилось (Да/Нет)': r.gotIt,
    'Комментарий': r.comment || ''
  }));

  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [
    { wch: 20 }, { wch: 28 }, { wch: 80 }, { wch: 20 }, { wch: 60 }
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Ответы');
  XLSX.writeFile(wb, 'feedback.xlsx');
}

/* ==========================
   Инициализация
   ========================== */
function bindEvents() {
  $('region').addEventListener('change', onRegionChange);
  $('comment').addEventListener('input', onCommentInput);
  $('btnNext').addEventListener('click', next);
  $('btnBack').addEventListener('click', back);
  $('export').addEventListener('click', exportToExcel);

  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.shiftKey && e.code === 'KeyA') {
      e.preventDefault();
      requestAdminAccess();
    }
  });
}

document.addEventListener('DOMContentLoaded', () => {
  fillRegions();
  bindEvents();

  const params = new URLSearchParams(window.location.search);
  if (params.get('admin') === '1') requestAdminAccess();

  showStep(1);
});
</script>
</body>
